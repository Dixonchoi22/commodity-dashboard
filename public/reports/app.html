<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commodity Dashboard — Procurement PMO Europe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0F172A; --card:#1E293B; --border:#334155; --border2:#26344a;
    --ink:#F8FAFC; --muted:#94A3B8; --dim:#64748B; --blue:#60A5FA;
    --up:#F87171; --down:#4ADE80; --warn:#FACC15;
    --mono:'DM Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--blue);text-decoration:none}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes cdIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes cdFade{from{opacity:0}to{opacity:1}}
  .wrap{max-width:1120px;margin:0 auto;padding:44px 24px 90px}
  .wrapR{max-width:1280px;margin:0 auto;padding:22px 24px 90px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:0 0 10px}
  .h1{font-size:40px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:0}
  .lead{color:var(--muted);font-size:16px;margin:12px 0 0;max-width:640px}
  .sec{display:flex;align-items:center;gap:10px;margin:26px 0 16px}
  .sec .lbl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .sec .ln{flex:1;height:1px;background:#1E293B}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px;animation:cdIn .35s ease both}
  .qbadge{font-size:14px;font-weight:800;color:#0F172A;background:var(--blue);padding:4px 10px;border-radius:7px}
  .tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
  .tag.latest{color:var(--down);background:rgba(74,222,128,.14);border:1px solid rgba(74,222,128,.4)}
  .tag.arch{color:var(--muted);background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.3)}
  .glance{display:flex;flex-wrap:wrap;gap:10px;padding:13px 15px;border-radius:11px;background:var(--bg);border:1px solid var(--border2)}
  .glance .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .num{font-family:var(--mono)}
  .chipbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:#CBD5E1;font-size:12px;font-weight:600;cursor:pointer}
  .chipbtn:hover{border-color:var(--blue);color:var(--ink);background:#182338}
  .dot{border-radius:2px;flex:none}
  .cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 15px;border-radius:10px;border:none;background:var(--blue);color:#0F172A;font-size:14px;font-weight:700;cursor:pointer}
  .cta:hover{background:#93C5FD}
  .cta.ghost{background:var(--bg);color:#E2E8F0;border:1px solid #3d4f6b}
  .cta.ghost:hover{border-color:var(--blue);background:#182338}
  .note{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:11px;background:#131c2e;border:1px solid var(--border2)}
  .note p{margin:0;font-size:12px;color:var(--muted);line-height:1.55}
  /* topbar */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border2)}
  .topbar-in{max-width:1280px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--blue);font-size:12.5px;font-weight:600;cursor:pointer}
  .back:hover{background:#182338}
  .layout{display:grid;grid-template-columns:minmax(0,236px) minmax(0,1fr);gap:24px;align-items:start}
  aside.rail{position:sticky;top:74px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 92px);overflow-y:auto;padding-right:4px}
  .rail-h{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:2px 6px 8px}
  .rail-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;border:1px solid transparent;background:none;color:inherit;text-align:left;cursor:pointer;width:100%}
  .rail-item:hover{background:#0F172A}
  .rail-item.active{background:#0F172A;border-color:var(--border)}
  .rail-item .nm{display:block;font-size:13px;font-weight:600;color:#E2E8F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-item .sub{font-size:11px;color:var(--dim)}
  main.content{min-width:0;display:flex;flex-direction:column;gap:20px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
  .filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px}
  .search{display:flex;align-items:center;gap:9px;flex:1;min-width:220px;padding:8px 12px;border-radius:9px;background:var(--bg);border:1px solid var(--border)}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:13px}
  .seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:2px}
  .seg button{padding:6px 13px;border-radius:7px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--blue);color:#0F172A}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px 17px;border-top:3px solid var(--blue)}
  .kpi.up{border-top-color:var(--up)} .kpi.down{border-top-color:var(--down)}
  .kpi .lab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0}
  .kpi .val{font-size:23px;font-weight:800;margin:7px 0 0;line-height:1.15}
  .kpi .sub{font-size:11px;color:var(--dim);margin:5px 0 0}
  .tabs{display:flex;align-items:center;gap:4px;padding:6px 6px 0;border-bottom:1px solid var(--border2)}
  .tab{padding:12px 18px;border:none;background:none;font-size:14px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
  .tab.on{color:var(--ink);border-bottom-color:var(--blue)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:11px 14px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);cursor:pointer;white-space:nowrap}
  td{padding:10px 14px;white-space:nowrap}
  tbody tr{border-bottom:1px solid #1a2536;cursor:pointer;border-left:3px solid transparent}
  tbody tr:hover{background:#0F172A}
  .pill{display:inline-flex;align-items:center;justify-content:center;min-width:78px;padding:4px 9px;border-radius:16px;font-size:12px;font-weight:700}
  .verdict{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:9px;font-size:13px;font-weight:700}
  .cap{font-size:12px;color:#8798ad;line-height:1.55}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(2,6,16,.7);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;animation:cdFade .2s ease}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;padding:24px;animation:cdIn .25s ease both}
  .x{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;font-size:16px}
  @media(max-width:820px){.layout{grid-template-columns:1fr}aside.rail{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}.h1{font-size:32px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="./app-data.js"></script>
<script>
(function(){
"use strict";
var D = window.CD_APP;
if(!D){document.getElementById('app').innerHTML='<div class="wrap">Data failed to load.</div>';return;}
var CAT_COLORS = D.categoryColors || {};
function catColor(n){return CAT_COLORS[n]||'#94A3B8';}
var esc = function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
function pct(v,dp){if(typeof v!=='number')return '—';return (v>=0?'+':'')+v.toFixed(dp==null?1:dp)+'%';}
function arrow(v){return v>=0?'▲':'▼';}

// diverging colour for a signed % (rising=risk warm, falling=opportunity green)
function divColor(v){
  if(typeof v!=='number'||Math.abs(v)<0.05) return {c:'#94A3B8',bg:'rgba(148,163,184,.12)'};
  return v>0 ? {c:'#F87171',bg:'rgba(248,113,113,.15)'} : {c:'#4ADE80',bg:'rgba(74,222,128,.15)'};
}
function pillHTML(v){
  if(typeof v!=='number') return '<span class="pill" style="color:#64748B;background:#0F172A">—</span>';
  var d=divColor(v);
  return '<span class="pill" style="color:'+d.c+';background:'+d.bg+'">'+arrow(v)+' '+pct(v)+'</span>';
}

var state={screen:'menu',slug:D.defaultSlug,cat:null,rankBy:'yoy',tab:'movers',q:'',sortKey:'yoy',sortDir:-1,gGroup:null};

/* ---------------- ROUTER ---------------- */
function parseHash(){
  var h=location.hash.replace(/^#\/?/,'');
  var p=h.split('/').filter(Boolean).map(decodeURIComponent);
  if(p[0]!=='q') return {screen:'menu'};
  var slug=p[1]; if(!D.reports[slug]) return {screen:'menu'};
  if(p[2]==='germany') return {screen:'germany',slug:slug,gGroup:p[3]||null};
  if(p[2]==='c') return {screen:'report',slug:slug,cat:p[3]||null};
  return {screen:'report',slug:slug,cat:null};
}
function go(hash){location.hash=hash;}
window.addEventListener('hashchange',route);
function route(){
  var r=parseHash();
  state.screen=r.screen; state.slug=r.slug||D.defaultSlug;
  // reset per-view controls on navigation
  state.cat=r.cat||null; state.gGroup=r.gGroup||null; state.q=''; state.tab='movers';
  state.sortKey='yoy'; state.sortDir=-1;
  render(); window.scrollTo(0,0);
}

/* ---------------- MENU ---------------- */
function menuHTML(){
  var cards=D.menu.map(function(m,i){
    var delta=divColor(m.hicpYoY);
    var quick=(m.categories||[]).slice().sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(c){
      return '<button class="chipbtn" data-go="#/q/'+m.slug+'/c/'+encodeURIComponent(c.name)+'" title="'+esc(c.name)+' · net '+pct(c.netYoY)+' YoY">'
        +'<span class="dot" style="width:8px;height:8px;background:'+c.color+'"></span>'+esc(c.name)+'</button>';
    }).join('');
    return '<div class="card" style="animation-delay:'+(i*60)+'ms">'
      +'<div style="display:flex;align-items:center;gap:10px">'
        +'<span class="qbadge">'+esc(m.q)+'</span>'
        +'<span class="tag '+(m.latest?'latest':'arch')+'">'+(m.latest?'Latest':'Archive')+'</span>'
        +'<span style="flex:1"></span><span style="font-size:12.5px;color:var(--muted)">'+esc(m.region)+'</span>'
      +'</div>'
      +'<div><h2 style="font-size:19px;font-weight:700;margin:0">'+esc(m.title)+'</h2>'
        +'<p style="font-size:14px;font-weight:600;color:var(--blue);margin:5px 0 0">'+esc(m.period)+'</p></div>'
      +'<div class="glance">'
        +'<div style="flex:1;min-width:120px"><div class="k">EU Food HICP</div>'
          +'<div style="display:flex;align-items:baseline;gap:8px;margin-top:3px">'
          +'<span class="num" style="font-size:22px;font-weight:800">'+(m.hicpLevel!=null?m.hicpLevel:'—')+'</span>'
          +'<span style="font-size:12.5px;font-weight:700;color:'+delta.c+'">'+arrow(m.hicpYoY)+' '+pct(m.hicpYoY)+' YoY</span></div></div>'
        +'<div style="width:1px;background:var(--border2);align-self:stretch"></div>'
        +'<div style="flex:1;min-width:120px"><div class="k" title="Commodities with YoY beyond ±25%">Risks / Opportunities</div>'
          +'<div style="display:flex;align-items:baseline;gap:12px;margin-top:5px">'
          +'<span style="font-size:13px;font-weight:700;color:var(--up)">▲ '+m.riskN+' risk</span>'
          +'<span style="font-size:13px;font-weight:700;color:var(--down)">▼ '+m.oppN+' opp</span></div></div>'
      +'</div>'
      +'<div><div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:9px">⚡ Jump to your category</div>'
        +'<div style="display:flex;flex-wrap:wrap;gap:7px">'+quick+'</div></div>'
      +'<button class="cta" data-go="#/q/'+m.slug+'"><span>Open '+esc(m.q)+' report</span>'
        +'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>'
    +'</div>';
  }).join('');

  // Germany deep-dive cards (quarters that have it)
  var dds=D.menu.filter(function(m){return m.hasGermany;}).map(function(m){
    var d=divColor(m.gYoY);
    return '<div class="card">'
      +'<div style="display:flex;align-items:center;gap:13px"><span style="font-size:28px">🇩🇪</span>'
        +'<div><h2 style="font-size:19px;font-weight:700;margin:0">Germany — '+esc(m.q)+'</h2>'
        +'<p style="font-size:13px;color:var(--muted);margin:4px 0 0">'+esc(m.period)+' · Destatis CP01 breakdown</p></div></div>'
      +'<div class="glance"><div style="flex:1"><div class="k">DE Food Index</div>'
        +'<div style="display:flex;align-items:baseline;gap:8px;margin-top:3px">'
        +'<span class="num" style="font-size:22px;font-weight:800">'+(m.gIndex!=null?m.gIndex:'—')+'</span>'
        +'<span style="font-size:12.5px;font-weight:700;color:'+d.c+'">'+pct(m.gYoY)+' YoY</span></div></div></div>'
      +'<p class="cap" style="display:flex;align-items:center;gap:7px"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--warn)"></span>Base 2020 = 100 · not comparable to EU HICP (2025 = 100).</p>'
      +'<button class="cta ghost" data-go="#/q/'+m.slug+'/germany"><span>Open Germany deep-dive</span>'
        +'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>'
    +'</div>';
  }).join('');

  return '<div class="wrap">'
    +'<header><p class="eyebrow">'+esc(D.brand.eyebrow)+'</p><h1 class="h1">'+esc(D.brand.title)+'</h1>'
    +'<p class="lead">'+esc(D.brand.subtitle)+'. Pick your reporting quarter — then jump straight to your category.</p></header>'
    +'<div class="sec"><div class="lbl">Reporting quarters</div><div class="ln"></div></div>'
    +'<div class="grid-cards">'+cards+'</div>'
    +(dds?'<div class="sec"><div class="lbl">Regional deep-dive</div><div class="ln"></div></div><div class="grid-cards">'+dds+'</div>':'')
    +'<div class="note" style="margin-top:26px;max-width:760px"><span style="color:var(--dim);flex:none">ⓘ</span>'
      +'<p>EU Food HICP is indexed to <b style="color:#CBD5E1">2025 = 100</b> (Eurostat teicp010). German figures use Destatis (base <b style="color:#CBD5E1">2020 = 100</b>) and are <b style="color:#CBD5E1">not directly comparable</b>.</p></div>'
    +'</div>';
}

/* ---------------- REPORT ---------------- */
function currentRows(rep){
  var rows=rep.rows.slice();
  if(state.cat) rows=rows.filter(function(r){return r.category===state.cat;});
  if(state.q){var q=state.q.toLowerCase();rows=rows.filter(function(r){return r.name.toLowerCase().indexOf(q)>=0||r.category.toLowerCase().indexOf(q)>=0;});}
  return rows;
}
function reportHTML(){
  var rep=D.reports[state.slug], meta=rep.meta;
  var railCats=rep.categories.slice().sort(function(a,b){return a.name.localeCompare(b.name);});
  var totalCount=rep.rows.length;
  var railAllActive=!state.cat;
  var rail='<div class="rail-h">Your category</div>'
    +'<button class="rail-item '+(railAllActive?'active':'')+'" data-go="#/q/'+state.slug+'">'
      +'<span class="dot" style="width:9px;height:9px;background:linear-gradient(135deg,#60A5FA,#A78BFA)"></span>'
      +'<span style="flex:1;font-size:13.5px;font-weight:600">All categories</span>'
      +'<span class="num" style="font-size:11px;color:var(--dim)">'+totalCount+'</span></button>'
    +'<div style="height:1px;background:#1E293B;margin:5px 4px"></div>'
    +railCats.map(function(c){
      var d=divColor(c.netYoY);
      return '<button class="rail-item '+(state.cat===c.name?'active':'')+'" data-go="#/q/'+state.slug+'/c/'+encodeURIComponent(c.name)+'" title="'+esc(c.name)+' · avg YoY '+pct(c.netYoY)+'">'
        +'<span class="dot" style="width:9px;height:9px;background:'+c.color+'"></span>'
        +'<span style="flex:1;min-width:0"><span class="nm">'+esc(c.name)+'</span><span class="sub">'+c.count+' items</span></span>'
        +'<span class="num" style="font-size:11.5px;font-weight:700;color:'+d.c+'">'+pct(c.netYoY)+'</span></button>';
    }).join('');

  var filters='<div class="filters">'
    +'<div class="search"><span style="color:var(--dim)">🔎</span>'
      +'<input id="q" value="'+esc(state.q)+'" placeholder="Search '+(state.cat?esc(state.cat):'all commodities')+'…"/></div>'
    +'<div style="display:flex;align-items:center;gap:7px"><span style="font-size:11px;font-weight:600;color:var(--dim)">Rank by</span>'
      +'<div class="seg"><button data-rank="mom" class="'+(state.rankBy==='mom'?'on':'')+'">MoM</button>'
      +'<button data-rank="yoy" class="'+(state.rankBy==='yoy'?'on':'')+'">YoY</button></div></div>'
    +(state.cat?'<button class="chipbtn" data-go="#/q/'+state.slug+'">✕ Clear filter</button>':'')
    +'</div>';

  var body = state.cat ? catSummaryHTML(rep) : overviewHTML(rep);
  var moversCard = moversTableHTML(rep);
  var strategy = state.cat ? '' : strategyHTML(rep);

  return '<div style="animation:cdFade .3s ease">'
    +'<div class="topbar"><div class="topbar-in">'
      +'<button class="back" data-go="#/"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>All quarters</button>'
      +'<div style="display:flex;align-items:center;gap:9px"><span class="qbadge" style="font-size:13px">'+esc(meta.q)+'</span>'
        +'<div><div style="font-size:14px;font-weight:700;line-height:1.1">'+esc(meta.title)+'</div>'
        +'<div style="font-size:11.5px;color:var(--muted)">'+esc(meta.region)+' · MoM '+esc(meta.periodMom)+' · YoY '+esc(meta.periodYoy)+'</div></div></div>'
      +'<span style="flex:1"></span>'
      +'<div style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:var(--down)"></span>Source: '+esc(meta.source)+'</div>'
    +'</div></div>'
    +'<div class="wrapR layout">'
      +'<aside class="rail">'+rail+'</aside>'
      +'<main class="content">'+filters+body+moversCard+strategy+'</main>'
    +'</div></div>';
}

function overviewHTML(rep){
  var kpis=rep.kpis.map(function(k){
    return '<div class="kpi '+esc(k.tone)+'"><p class="lab">'+esc(k.label)+'</p>'
      +'<p class="val" style="color:'+(k.tone==='up'?'var(--up)':k.tone==='down'?'var(--down)':'var(--ink)')+'">'+esc(k.value)+'</p>'
      +'<p class="sub">'+esc(k.sub)+'</p></div>';
  }).join('');
  var highs=(rep.highlights||[]).map(function(h){
    var col=h.tone==='red'?'var(--up)':h.tone==='green'?'var(--down)':'var(--blue)';
    return '<div style="padding:12px 13px;border-radius:10px;background:var(--bg);border-left:3px solid '+col+'">'
      +'<p style="font-size:12.5px;font-weight:700;margin:0;color:'+col+'">'+esc(h.label)+'</p>'

function verdictFor(net){
  if(typeof net!=='number') return {label:'No data',glyph:'•',c:'#94A3B8',bg:'rgba(148,163,184,.12)'};
  if(net<=-10) return {label:'Opportunity',glyph:'▼',c:'#4ADE80',bg:'rgba(74,222,128,.14)'};
  if(net>=10) return {label:'Risk',glyph:'▲',c:'#F87171',bg:'rgba(248,113,113,.14)'};
  return {label:'Watch',glyph:'•',c:'#FACC15',bg:'rgba(250,204,21,.14)'};
}
function catSummaryHTML(rep){
  var c=rep.categories.filter(function(x){return x.name===state.cat;})[0];
  if(!c) return '';
  var rows=rep.rows.filter(function(r){return r.category===state.cat;});
  var withY=rows.filter(function(r){return typeof r.yoy==='number';});
  var topUp=withY.slice().sort(function(a,b){return b.yoy-a.yoy;})[0];
  var topDn=withY.slice().sort(function(a,b){return a.yoy-b.yoy;})[0];
  var v=verdictFor(c.netYoY);
  var reason;
  if(v.label==='Opportunity') reason='Category prices are falling on average ('+pct(c.netYoY)+' YoY) — a window to lock in longer-term contracts. Deepest fall: '+(topDn?esc(topDn.name)+' '+pct(topDn.yoy):'—')+'.';
  else if(v.label==='Risk') reason='Category prices are rising on average ('+pct(c.netYoY)+' YoY) — hedge or renegotiate. Sharpest rise: '+(topUp?esc(topUp.name)+' '+pct(topUp.yoy):'—')+'.';
  else reason='Mixed / broadly flat ('+pct(c.netYoY)+' YoY). Watch the spread: '+(topUp?esc(topUp.name)+' '+pct(topUp.yoy):'—')+' vs '+(topDn?esc(topDn.name)+' '+pct(topDn.yoy):'—')+'.';
  var tiles=[
    {l:'Avg MoM',v:pct(c.netMoM),t:c.netMoM},
    {l:'Avg YoY',v:pct(c.netYoY),t:c.netYoY},

    {l:'Deepest fall (YoY)',v:topDn?pct(topDn.yoy):'—',t:topDn?topDn.yoy:null,s:topDn?topDn.name:''}
  ].map(function(t){var d=divColor(t.t);return '<div style="padding:14px 15px;border-radius:11px;background:var(--bg);border:1px solid var(--border2)">'
    +'<p style="font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin:0">'+t.l+'</p>'
    +'<p class="num" style="font-size:19px;font-weight:800;margin:7px 0 0;color:'+d.c+'">'+t.v+'</p>'
    +(t.s?'<p style="font-size:11px;color:#8798ad;margin:4px 0 0">'+esc(t.s)+'</p>':'')+'</div>';}).join('');
  return '<div class="panel" style="animation:cdFade .25s ease;border-top:3px solid '+c.color+'">'
    +'<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'
      +'<span class="dot" style="width:14px;height:14px;border-radius:4px;background:'+c.color+'"></span>'
      +'<h2 style="font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em">'+esc(c.name)+'</h2>'
      +'<span class="num" style="font-size:12px;color:var(--dim)">'+c.count+' commodities</span><span style="flex:1"></span>'
      +'<span class="verdict" style="color:'+v.c+';background:'+v.bg+'"><span>'+v.glyph+'</span>'+v.label+'</span></div>'
    +'<p style="font-size:13px;color:#CBD5E1;margin:12px 0 0;line-height:1.55"><b style="color:var(--ink)">Verdict:</b> '+reason+'</p>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px">'+tiles+'</div>'
    +'<p class="cap" style="margin:14px 0 0;border-top:1px solid var(--border2);padding-top:11px">Averages across every commodity in this category. Green = falling prices (a chance to lock in). Red = rising prices (a budget risk to hedge or renegotiate).</p>'
  +'</div>';
}

function moversTableHTML(rep){
  var rows=currentRows(rep);
  var measure=state.rankBy;
  var measureLabel=measure==='mom'?'MoM':'YoY';
  // movers: most extreme by |measure|, shown diverging (risers top → fallers bottom)
  var mrows=rows.filter(function(r){return typeof r[measure]==='number';});
  var movers=mrows.slice().sort(function(a,b){return Math.abs(b[measure])-Math.abs(a[measure]);}).slice(0, state.cat?mrows.length:16)
    .sort(function(a,b){return b[measure]-a[measure];});
  var maxAbs=Math.max.apply(null,movers.map(function(r){return Math.abs(r[measure]);}).concat([1]));
  var moversRows=movers.map(function(r){
    var v=r[measure], d=divColor(v), w=Math.max(2,Math.abs(v)/maxAbs*47);
    var bar=v>=0?'left:50%;width:'+w+'%;background:'+d.c:'right:50%;width:'+w+'%;background:'+d.c;
    return '<div class="mv" data-open="'+esc(r.name)+'" title="'+esc(r.name)+' · click for detail" style="display:grid;grid-template-columns:180px 1fr 76px;align-items:center;gap:12px;padding:4px 6px;cursor:pointer;border-radius:7px">'
      +'<div style="display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0">'
        +'<span style="font-size:12.5px;color:#E2E8F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.name)+(r.forecast?' <span style="color:#4ADE80" title="Forward curve">◈</span>':'')+'</span>'
        +'<span class="dot" style="width:8px;height:8px;background:'+catColor(r.category)+'"></span></div>'
      +'<div style="position:relative;height:16px"><div style="position:absolute;top:2px;bottom:2px;border-radius:3px;'+bar+'"></div></div>'
      +'<div class="num" style="font-size:12.5px;font-weight:700;color:'+d.c+'">'+arrow(v)+' '+pct(v)+'</div></div>';
  }).join('');

  var sortArrow=function(k){return state.sortKey===k?(state.sortDir<0?' ↓':' ↑'):'';};
  var tRows=rows.slice().sort(function(a,b){
    var k=state.sortKey;
    if(k==='name') return state.sortDir*a.name.localeCompare(b.name);
    var av=a[k], bv=b[k]; if(typeof av!=='number')av=-1e9; if(typeof bv!=='number')bv=-1e9;
    return state.sortDir*(bv-av);
  }).map(function(r){
    return '<tr data-open="'+esc(r.name)+'" style="border-left-color:'+catColor(r.category)+'">'
      +'<td><span style="display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;font-size:12px"><span class="dot" style="width:8px;height:8px;background:'+catColor(r.category)+'"></span>'+esc(r.category)+'</span></td>'
      +'<td style="font-weight:600">'+esc(r.name)+(r.forecast?' <span style="color:#4ADE80" title="Forward curve">◈</span>':'')+'</td>'
      +'<td class="num" style="color:var(--muted);font-size:12px">'+esc(r.price||'—')+'</td>'
      +'<td style="text-align:center">'+pillHTML(r.mom)+'</td>'
      +'<td style="text-align:center">'+pillHTML(r.yoy)+'</td></tr>';
  }).join('');

  return '<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden">'
    +'<div class="tabs"><button class="tab '+(state.tab==='movers'?'on':'')+'" data-tab="movers">Top movers</button>'
      +'<button class="tab '+(state.tab==='table'?'on':'')+'" data-tab="table">Detail table <span class="num" style="font-size:12px;color:var(--dim)">'+rows.length+'</span></button></div>'
    +(state.tab==='movers'
      ? '<div style="padding:20px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px">'
          +'<h3 style="font-size:16px;font-weight:700;margin:0">'+(state.cat?esc(state.cat):'Biggest movers')+'</h3>'
          +'<span style="font-size:11.5px;color:var(--dim)">Ranked by '+measureLabel+' · left = falling · right = rising</span></div>'
          +'<div style="position:relative"><div style="position:absolute;left:50%;top:0;bottom:14px;width:1px;background:var(--border)"></div>'+(moversRows||'<p class="cap">No matching commodities.</p>')+'</div>'
          +'<p class="cap" style="margin:16px 0 0;border-top:1px solid var(--border2);padding-top:12px">Each bar is one commodity\'s '+measureLabel+' price change. Right = getting dearer (risk); left = getting cheaper (opportunity). Click any bar for commentary'+(rep.rows.some(function(r){return r.forecast;})?' and the ◈ forward curve':'')+'.</p></div>'
      : '<div style="padding:6px 4px 10px;overflow-x:auto"><table><thead><tr>'
          +'<th>Category</th><th data-sort="name">Commodity'+sortArrow('name')+'</th><th>Latest price</th>'
          +'<th data-sort="mom" style="text-align:center">MoM'+sortArrow('mom')+'</th><th data-sort="yoy" style="text-align:center">YoY'+sortArrow('yoy')+'</th></tr></thead>'
          +'<tbody>'+(tRows||'<tr><td colspan="5" style="color:var(--dim);padding:20px">No matching commodities.</td></tr>')+'</tbody></table></div>')
  +'</div>';
}

  ov.innerHTML='<div class="modal" style="position:relative"><button class="x" data-close>✕</button>'
    +'<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap"><span class="dot" style="width:11px;height:11px;border-radius:3px;background:'+catColor(r.category)+'"></span>'
      +'<h2 style="font-size:20px;font-weight:800;margin:0">'+esc(r.name)+'</h2>'
      +'<span style="font-size:12px;color:var(--muted)">'+esc(r.category)+'</span></div>'
    +'<div style="display:flex;gap:10px;margin:14px 0 0;flex-wrap:wrap">'
      +'<div style="padding:10px 13px;border-radius:10px;background:var(--bg);border:1px solid var(--border2)"><div style="font-size:10px;text-transform:uppercase;color:var(--dim);font-weight:700">Latest price</div><div class="num" style="font-size:16px;font-weight:800;margin-top:3px">'+esc(r.price||'—')+'</div></div>'
      +'<div style="padding:10px 13px;border-radius:10px;background:var(--bg);border:1px solid var(--border2)"><div style="font-size:10px;text-transform:uppercase;color:var(--dim);font-weight:700">MoM</div><div style="margin-top:3px">'+pillHTML(r.mom)+'</div></div>'
      +'<div style="padding:10px 13px;border-radius:10px;background:var(--bg);border:1px solid var(--border2)"><div style="font-size:10px;text-transform:uppercase;color:var(--dim);font-weight:700">YoY</div><div style="margin-top:3px">'+pillHTML(r.yoy)+'</div></div></div>'
    +(r.note?'<p style="font-size:13px;color:#CBD5E1;line-height:1.6;margin:16px 0 0">'+esc(r.note)+'</p>':'<p class="cap" style="margin:16px 0 0">No market commentary recorded for this commodity this quarter.</p>')
    +chart+'</div>';
  ov.addEventListener('click',function(e){if(e.target===ov||e.target.hasAttribute('data-close'))closeModal();});
  document.body.appendChild(ov);
  if(fc) drawForecast(fc);
}
function closeModal(){var o=document.getElementById('ov');if(o)o.remove();}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

/* ---------------- CHARTS ---------------- */
var _charts=[];
function killCharts(){_charts.forEach(function(c){try{c.destroy();}catch(e){}});_charts=[];}
function lineChart(id,labels,values,color){
  var el=document.getElementById(id); if(!el||!window.Chart) return;
  var ctx=el.getContext('2d');
  var grad=ctx.createLinearGradient(0,0,0,260); grad.addColorStop(0,color+'55'); grad.addColorStop(1,color+'05');
  _charts.push(new Chart(ctx,{type:'line',data:{labels:labels,datasets:[{data:values,borderColor:color,backgroundColor:grad,borderWidth:2,fill:true,tension:.32,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:color}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0F172A',borderColor:'#334155',borderWidth:1,titleColor:'#F8FAFC',bodyColor:'#CBD5E1',padding:10}},
    scales:{x:{grid:{color:'#1E293B'},ticks:{color:'#64748B',font:{size:10},maxRotation:0,autoSkip:false,callback:function(v,i){var L=this.chart.data.labels;return (L.length-1-i)%2===0?L[i]:'';}}},y:{grid:{color:'#1E293B'},ticks:{color:'#64748B',font:{size:10}}}}}}));
}
function drawForecast(fc){
  var el=document.getElementById('fcChart'); if(!el||!window.Chart) return;
  lineChart('fcChart',fc.points.map(function(p){return p.d;}),fc.points.map(function(p){return p.v;}),'#4ADE80');
}

/* ---------------- MOUNT + EVENTS ---------------- */
function render(){
  killCharts();
  var app=document.getElementById('app');
  if(state.screen==='menu') app.innerHTML=menuHTML();
  else if(state.screen==='germany') app.innerHTML=germanyHTML();
  else app.innerHTML=reportHTML();
  // charts after DOM is in place
  if(state.screen==='report' && !state.cat){var rep=D.reports[state.slug];lineChart('hicpChart',rep.hicp.labels,rep.hicp.values,'#60A5FA');}
  if(state.screen==='germany' && !state.gGroup){var g=D.reports[state.slug].germany;if(g)lineChart('gTrend',g.trend.labels,g.trend.values,'#FBBF24');}
}
document.getElementById('app').addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-open],[data-rank],[data-tab],[data-sort]');
  if(!t) return;
  if(t.hasAttribute('data-go')){go(t.getAttribute('data-go'));return;}
  if(t.hasAttribute('data-open')){openModal(t.getAttribute('data-open'));return;}
  if(t.hasAttribute('data-rank')){state.rankBy=t.getAttribute('data-rank');render();return;}
  if(t.hasAttribute('data-tab')){state.tab=t.getAttribute('data-tab');render();return;}
  if(t.hasAttribute('data-sort')){var k=t.getAttribute('data-sort');if(state.sortKey===k)state.sortDir*=-1;else{state.sortKey=k;state.sortDir=k==='name'?1:-1;}render();return;}
});
document.getElementById('app').addEventListener('input',function(e){
  if(e.target.id==='q'){state.q=e.target.value;
    // re-render only the movers/table + keep focus
    render();var i=document.getElementById('q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
});
route();
})();
</script>
</body>
</html>
