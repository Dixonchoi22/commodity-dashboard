<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commodity Dashboard — Procurement PMO Europe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0F172A; --card:#1E293B; --border:#334155; --border2:#26344a;
    --ink:#F8FAFC; --muted:#94A3B8; --dim:#64748B; --blue:#60A5FA;
    --up:#F87171; --down:#4ADE80; --warn:#FACC15;
    --mono:'DM Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--blue);text-decoration:none}
  button{font-family:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes cdIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes cdFade{from{opacity:0}to{opacity:1}}
  .wrap{max-width:1120px;margin:0 auto;padding:44px 24px 90px}
  .wrapR{max-width:1280px;margin:0 auto;padding:22px 24px 90px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:0 0 10px}
  .h1{font-size:40px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:0}
  .lead{color:var(--muted);font-size:16px;margin:12px 0 0;max-width:640px}
  .sec{display:flex;align-items:center;gap:10px;margin:26px 0 16px}
  .sec .lbl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .sec .ln{flex:1;height:1px;background:#1E293B}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:20px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px;animation:cdIn .35s ease both}
  .qbadge{font-size:14px;font-weight:800;color:#0F172A;background:var(--blue);padding:4px 10px;border-radius:7px}
  .tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
  .tag.latest{color:var(--down);background:rgba(74,222,128,.14);border:1px solid rgba(74,222,128,.4)}
  .tag.arch{color:var(--muted);background:rgba(148,163,184,.12);border:1px solid rgba(148,163,184,.3)}
  .glance{display:flex;flex-wrap:wrap;gap:10px;padding:13px 15px;border-radius:11px;background:var(--bg);border:1px solid var(--border2)}
  .glance .k{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .num{font-family:var(--mono)}
  .chipbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:#CBD5E1;font-size:12px;font-weight:600;cursor:pointer}
  .chipbtn:hover{border-color:var(--blue);color:var(--ink);background:#182338}
  .dot{border-radius:2px;flex:none}
  .cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 15px;border-radius:10px;border:none;background:var(--blue);color:#0F172A;font-size:14px;font-weight:700;cursor:pointer;text-align:left}
  .cta:hover{background:#93C5FD}
  .cta.ghost{background:var(--bg);color:#E2E8F0;border:1px solid #3d4f6b}
  .cta.ghost:hover{border-color:var(--blue);background:#182338}
  .note{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:11px;background:#131c2e;border:1px solid var(--border2)}
  .note p{margin:0;font-size:12px;color:var(--muted);line-height:1.55}
  /* language picker */
  .langsel{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--muted)}
  .langsel:focus-within{border-color:var(--blue)}
  .langsel select{appearance:none;-webkit-appearance:none;border:none;background:none;color:#E2E8F0;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;outline:none;padding-right:12px;
    background-image:linear-gradient(45deg,transparent 50%,#64748B 50%),linear-gradient(135deg,#64748B 50%,transparent 50%);
    background-position:right 4px top 52%,right 0px top 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
  .langsel select option{background:#1E293B;color:#E2E8F0}
  /* topbar */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border2)}
  .topbar-in{max-width:1280px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--blue);font-size:12.5px;font-weight:600;cursor:pointer}
  .back:hover{background:#182338}
  .layout{display:grid;grid-template-columns:minmax(0,236px) minmax(0,1fr);gap:24px;align-items:start}
  aside.rail{position:sticky;top:74px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 92px);overflow-y:auto;padding-right:4px}
  .rail-h{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:2px 6px 8px}
  .rail-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;border:1px solid transparent;background:none;color:inherit;text-align:left;cursor:pointer;width:100%}
  .rail-item:hover{background:#0F172A}
  .rail-item.active{background:#0F172A;border-color:var(--border)}
  .rail-item .nm{display:block;font-size:13px;font-weight:600;color:#E2E8F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rail-item .sub{font-size:11px;color:var(--dim)}
  main.content{min-width:0;display:flex;flex-direction:column;gap:20px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
  .filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px}
  .search{display:flex;align-items:center;gap:9px;flex:1;min-width:220px;padding:8px 12px;border-radius:9px;background:var(--bg);border:1px solid var(--border)}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:13px}
  .seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:2px}
  .seg button{padding:6px 13px;border-radius:7px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--blue);color:#0F172A}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px 17px;border-top:3px solid var(--blue)}
  .kpi.up{border-top-color:var(--up)} .kpi.down{border-top-color:var(--down)}
  .kpi .lab{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0}
  .kpi .val{font-size:23px;font-weight:800;margin:7px 0 0;line-height:1.15}
  .kpi .sub{font-size:11px;color:var(--dim);margin:5px 0 0}
  .tabs{display:flex;align-items:center;gap:4px;padding:6px 6px 0;border-bottom:1px solid var(--border2)}
  .tab{padding:12px 18px;border:none;background:none;font-size:14px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}
  .tab.on{color:var(--ink);border-bottom-color:var(--blue)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:11px 14px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);cursor:pointer;white-space:nowrap}
  td{padding:10px 14px;white-space:nowrap}
  tbody tr{border-bottom:1px solid #1a2536;cursor:pointer;border-left:3px solid transparent}
  tbody tr:hover{background:#0F172A}
  .pill{display:inline-flex;align-items:center;justify-content:center;min-width:84px;padding:4px 9px;border-radius:16px;font-size:12px;font-weight:700}
  .verdict{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:9px;font-size:13px;font-weight:700}
  .cap{font-size:12px;color:#8798ad;line-height:1.55}
  /* indirect inflation */
  .qoq{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:5px;font-size:9.5px;font-weight:700;
    letter-spacing:.04em;color:var(--warn);background:rgba(250,204,21,.13);border:1px solid rgba(250,204,21,.3);vertical-align:middle}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(2,6,16,.7);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;animation:cdFade .2s ease}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;padding:24px;animation:cdIn .25s ease both}
  .x{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;font-size:16px}
  @media(max-width:820px){.layout{grid-template-columns:1fr}aside.rail{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}.h1{font-size:32px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="./app-data.js?v=346927e778"></script>
<script>
(function(){
"use strict";
var D = window.CD_APP;
if(!D){document.getElementById('app').innerHTML='<div class="wrap">Data failed to load.</div>';return;}
var CAT_COLORS = D.categoryColors || {};
function catColor(n){return CAT_COLORS[n]||'#94A3B8';}
var esc = function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};

/* ---------------- I18N ----------------
   The build (scripts/build_app_data.py) ships every language in
   D.i18n; nothing here is hardcoded English. Data written by the analyst
   team (commodity names, quarter highlights, market commentary) stays in
   its source language unless a data/{slug}/i18n/{lang}.json override
   exists — see note.sourceEnglish. */
var I18N = D.i18n || {languages:[{code:'en',name:'English',locale:'en-GB'}],strings:{},categories:{},coicop:{},phrases:{}};
var LANGS = I18N.languages;
var LANG = 'en', LOCALE = 'en-GB';

function pickLang(){
  var codes = LANGS.map(function(l){return l.code;});
  var q = /[?&]lang=([a-zA-Z-]+)/.exec(location.search);
  var wanted = [];
  if(q) wanted.push(q[1]);
  try{ var s=localStorage.getItem('cd.lang'); if(s) wanted.push(s); }catch(e){}
  var navs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language||''];
  wanted = wanted.concat(navs);
  for(var i=0;i<wanted.length;i++){
    var base = String(wanted[i]||'').toLowerCase().split('-')[0];
    if(codes.indexOf(base)>=0) return base;
  }
  return I18N.default || 'en';
}
function setLang(code,persist){
  LANG = code;
  var meta = LANGS.filter(function(l){return l.code===code;})[0] || LANGS[0];
  LOCALE = meta.locale || code;
  document.documentElement.lang = code;
  document.title = t('brand.title') + ' — ' + t('brand.eyebrow');
  if(persist){
    try{ localStorage.setItem('cd.lang',code); }catch(e){}
    // keep ?lang= in the URL so a copied link opens in the same language
    try{
      var u=new URL(location.href); u.searchParams.set('lang',code);
      history.replaceState(null,'',u.toString());
    }catch(e){}
  }
}
function t(key,params){
  var table = I18N.strings[LANG] || I18N.strings.en || {};
  var s = table[key];
  if(s==null) s = (I18N.strings.en||{})[key];
  if(s==null) return key;
  if(params) s = s.replace(/\{(\w+)\}/g,function(all,name){
    return params[name]!=null ? params[name] : all;
  });
  return s;
}
function tCat(name){ var m=I18N.categories[LANG]||{}; return m[name]||name; }
function tCoicop(code,fallback){ var m=I18N.coicop[LANG]||{}; return m[code]||fallback||code; }
function tPhrase(s){ if(!s) return ''; var m=I18N.phrases[LANG]||{}; return m[s]||s; }
// Commodity display name. The English name stays the identity used by
// data-open= and rep.rows lookups; only what the user reads changes.
function tName(n){ var m=(I18N.commodities||{})[LANG]||{}; return m[n]||n; }

/* ---------------- LOCALE FORMATTING ---------------- */
var MONTHS_EN=['january','february','march','april','may','june','july','august','september','october','november','december'];
function monthIndex(s){
  var n=String(s||'').toLowerCase().replace(/\.$/,'');
  for(var i=0;i<12;i++){
    if(n===MONTHS_EN[i] || (n.length===3 && n===MONTHS_EN[i].slice(0,3))) return i;
  }
  return -1;
}
function fmtMonthYear(mi,y,style){
  try{ return new Intl.DateTimeFormat(LOCALE,{month:style,year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,mi,1))); }
  catch(e){ return MONTHS_EN[mi]+' '+y; }
}
// "Jun 2026" -> the same month in the active locale. Style is fixed per call
// site rather than sniffed from the token: "May" is both the full name and
// its own abbreviation, so a per-token guess mixes styles within one string.
// Series labels (hicp, Destatis) are abbreviated; meta periods are spelled out.
function locMonth(s,style){
  if(!s) return '—';
  var m=/^([A-Za-z]{3,9})\.?\s+(\d{4})$/.exec(String(s).trim());
  if(!m) return s;
  var mi=monthIndex(m[1]); if(mi<0) return s;
  return fmtMonthYear(mi,parseInt(m[2],10),style||'short');
}
// "June 2026 vs May 2026" -> localised months + connector.
function locPeriod(s){
  if(!s) return '';
  return String(s)
    .replace(/([A-Za-z]{3,9})\.?\s+(\d{4})/g,function(all,w,y){
      var mi=monthIndex(w); if(mi<0) return all;
      return fmtMonthYear(mi,parseInt(y,10),'long');
    })
    .replace(/\bvs\.?\b/gi,t('common.vs'));
}
function periodLabel(y,m,fallback){
  if(typeof y!=='number'||typeof m!=='number') return fallback||'';
  return fmtMonthYear(m-1,y,'long');
}
function qLabel(qn,fy,fallback){
  if(typeof qn!=='number'||typeof fy!=='number') return fallback||'';
  return t('common.quarterFmt',{q:qn,y:fy});
}
function pct(v,dp){
  if(typeof v!=='number') return '—';
  dp = dp==null?1:dp;
  try{
    return new Intl.NumberFormat(LOCALE,{style:'percent',signDisplay:'always',
      minimumFractionDigits:dp,maximumFractionDigits:dp}).format(v/100);
  }catch(e){ return (v>=0?'+':'')+v.toFixed(dp)+'%'; }
}
function numf(v,minDp,maxDp){
  if(typeof v!=='number') return '—';
  try{
    return new Intl.NumberFormat(LOCALE,{minimumFractionDigits:minDp==null?1:minDp,
      maximumFractionDigits:maxDp==null?2:maxDp}).format(v);
  }catch(e){ return String(v); }
}
function cmp(a,b){ try{ return String(a).localeCompare(String(b),LOCALE); }catch(e){ return String(a)<String(b)?-1:1; } }
function arrow(v){return v>=0?'▲':'▼';}

// diverging colour for a signed % (rising=risk warm, falling=opportunity green)
function divColor(v){
  if(typeof v!=='number'||Math.abs(v)<0.05) return {c:'#94A3B8',bg:'rgba(148,163,184,.12)'};
  return v>0 ? {c:'#F87171',bg:'rgba(248,113,113,.15)'} : {c:'#4ADE80',bg:'rgba(74,222,128,.15)'};
}
function pillHTML(v){
  if(typeof v!=='number') return '<span class="pill" style="color:#64748B;background:#0F172A">—</span>';
  var d=divColor(v);
  return '<span class="pill" style="color:'+d.c+';background:'+d.bg+'">'+arrow(v)+' '+esc(pct(v))+'</span>';
}
function langPickerHTML(){
  var opts=LANGS.map(function(l){
    return '<option value="'+esc(l.code)+'"'+(l.code===LANG?' selected':'')+'>'+esc(l.name)+'</option>';
  }).join('');
  return '<label class="langsel" title="'+esc(t('lang.aria'))+'">'
    +'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">'
      +'<circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/>'
      +'<path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></svg>'
    +'<select id="cdlang" aria-label="'+esc(t('lang.aria'))+'">'+opts+'</select></label>';
}
// translated analyst text for the active quarter/language, when supplied
function overrides(rep){ return (rep && rep.tr && rep.tr[LANG]) || null; }

var state={screen:'menu',slug:D.defaultSlug,cat:null,rankBy:'yoy',tab:'movers',q:'',sortKey:'yoy',sortDir:-1,gGroup:null,iPillar:null};

/* ---------------- ROUTER ---------------- */
function parseHash(){
  var h=location.hash.replace(/^#\/?/,'');
  var p=h.split('/').filter(Boolean).map(decodeURIComponent);
  if(p[0]!=='q') return {screen:'menu'};
  var slug=p[1]; if(!D.reports[slug]) return {screen:'menu'};
  if(p[2]==='germany') return {screen:'germany',slug:slug,gGroup:p[3]||null};
  if(p[2]==='indirect') return {screen:'indirect',slug:slug,iPillar:p[3]||null};
  if(p[2]==='c') return {screen:'report',slug:slug,cat:p[3]||null};
  return {screen:'report',slug:slug,cat:null};
}
function go(hash){location.hash=hash;}
window.addEventListener('hashchange',route);
function route(){
  var r=parseHash();
  state.screen=r.screen; state.slug=r.slug||D.defaultSlug;
  // reset per-view controls on navigation
  state.cat=r.cat||null; state.gGroup=r.gGroup||null; state.iPillar=r.iPillar||null;
  state.q=''; state.tab='movers';
  state.sortKey='yoy'; state.sortDir=-1;
  render(); window.scrollTo(0,0);
}

/* ---------------- MENU ---------------- */
function menuHTML(){
  var cards=D.menu.map(function(m,i){
    var delta=divColor(m.hicpYoY);
    var q=qLabel(m.qn,m.fy,m.q);
    var quick=(m.categories||[]).slice().sort(function(a,b){return cmp(tCat(a.name),tCat(b.name));}).map(function(c){
      return '<button class="chipbtn" data-go="#/q/'+m.slug+'/c/'+encodeURIComponent(c.name)+'" title="'
        +esc(t('menu.catTitle',{name:tCat(c.name),pct:pct(c.netYoY),yoy:t('common.yoy')}))+'">'
        +'<span class="dot" style="width:8px;height:8px;background:'+c.color+'"></span>'+esc(tCat(c.name))+'</button>';
    }).join('');
    return '<div class="card" style="animation-delay:'+(i*60)+'ms">'
      +'<div style="display:flex;align-items:center;gap:10px">'
        +'<span class="qbadge">'+esc(q)+'</span>'
        +'<span class="tag '+(m.latest?'latest':'arch')+'">'+esc(m.latest?t('menu.latest'):t('menu.archive'))+'</span>'
        +'<span style="flex:1"></span><span style="font-size:12.5px;color:var(--muted)">'+esc(tPhrase(m.region))+'</span>'
      +'</div>'
      +'<div><h2 style="font-size:19px;font-weight:700;margin:0">'+esc(tPhrase(m.title))+'</h2>'
        +'<p style="font-size:14px;font-weight:600;color:var(--blue);margin:5px 0 0">'+esc(periodLabel(m.periodY,m.periodM,m.period))+'</p></div>'
      +'<div class="glance">'
        +'<div style="flex:1;min-width:120px"><div class="k">'+esc(t('menu.hicp'))+'</div>'
          +'<div style="display:flex;align-items:baseline;gap:8px;margin-top:3px">'
          +'<span class="num" style="font-size:22px;font-weight:800">'+esc(numf(m.hicpLevel))+'</span>'
          +'<span style="font-size:12.5px;font-weight:700;color:'+delta.c+'">'+arrow(m.hicpYoY)+' '+esc(pct(m.hicpYoY))+' '+esc(t('common.yoy'))+'</span></div></div>'
        +'<div style="width:1px;background:var(--border2);align-self:stretch"></div>'
        +'<div style="flex:1;min-width:120px"><div class="k" title="'+esc(t('menu.riskOppTitle'))+'">'+esc(t('menu.riskOpp'))+'</div>'
          +'<div style="display:flex;align-items:baseline;gap:12px;margin-top:5px">'
          +'<span style="font-size:13px;font-weight:700;color:var(--up)">▲ '+esc(t('menu.risksN',{n:m.riskN}))+'</span>'
          +'<span style="font-size:13px;font-weight:700;color:var(--down)">▼ '+esc(t('menu.oppsN',{n:m.oppN}))+'</span></div></div>'
      +'</div>'
      +'<div><div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:9px">⚡ '+esc(t('menu.jump'))+'</div>'
        +'<div style="display:flex;flex-wrap:wrap;gap:7px">'+quick+'</div></div>'
      +'<button class="cta" data-go="#/q/'+m.slug+'"><span>'+esc(t('menu.open',{q:q}))+'</span>'

}

// A KPI ships as a translation key plus a raw value, so both the caption and
// the number follow the active language.
function kpiValue(k){
  if(k.type==='pct') return pct(k.pct);
  if(k.type==='count') return numf(k.num,0,0);
  if(k.type==='namePct') return k.name ? esc(tName(k.name))+' ('+esc(pct(k.pct))+')' : '—';
  // percentage points — a gap between two rates, not a rate itself
  if(k.type==='pp') return typeof k.num==='number'
    ? esc(t('common.ppFmt',{v:(k.num>=0?'+':'−')+numf(Math.abs(k.num),1,1)})) : '—';
  return numf(k.num);
}
function kpiHTML(k){
  var params={}, subParams={};
  Object.keys(k.kp||{}).forEach(function(n){ params[n]= n==='month'?locMonth(k.kp[n]):k.kp[n]; });
  Object.keys(k.subp||{}).forEach(function(n){ subParams[n]= n==='month'?locMonth(k.subp[n]):k.subp[n]; });
  return '<div class="kpi '+esc(k.tone)+'"><p class="lab">'+esc(t(k.k,params))+'</p>'
    +'<p class="val" style="color:'+(k.tone==='up'?'var(--up)':k.tone==='down'?'var(--down)':'var(--ink)')+'">'+kpiValue(k)+'</p>'
    +'<p class="sub">'+esc(t(k.sub,subParams))+'</p></div>';
}

        +esc(t('chart.baseLabel',{base:rep.hicp.base}))+'</span></div>'

function verdictFor(net){
  if(typeof net!=='number') return {key:'none',label:t('verdict.none'),glyph:'•',c:'#94A3B8',bg:'rgba(148,163,184,.12)'};
  if(net<=-10) return {key:'opp',label:t('verdict.opportunity'),glyph:'▼',c:'#4ADE80',bg:'rgba(74,222,128,.14)'};
  if(net>=10) return {key:'risk',label:t('verdict.risk'),glyph:'▲',c:'#F87171',bg:'rgba(248,113,113,.14)'};
  return {key:'watch',label:t('verdict.watch'),glyph:'•',c:'#FACC15',bg:'rgba(250,204,21,.14)'};
}

  else reason=t('cat.reasonWatch',{pct:p,yoy:yoy,up:item(topUp),down:item(topDn)});

function moversTableHTML(rep){
  var rows=currentRows(rep);
  var measure=state.rankBy;
  var measureLabel=measure==='mom'?t('common.mom'):t('common.yoy');
  // movers: most extreme by |measure|, shown diverging (risers top → fallers bottom)
  var mrows=rows.filter(function(r){return typeof r[measure]==='number';});
  var movers=mrows.slice().sort(function(a,b){return Math.abs(b[measure])-Math.abs(a[measure]);}).slice(0, state.cat?mrows.length:16)
    .sort(function(a,b){return b[measure]-a[measure];});
  var maxAbs=Math.max.apply(null,movers.map(function(r){return Math.abs(r[measure]);}).concat([1]));
  var moversRows=movers.map(function(r){
    var v=r[measure], d=divColor(v), w=Math.max(2,Math.abs(v)/maxAbs*47);
    var bar=v>=0?'left:50%;width:'+w+'%;background:'+d.c:'right:50%;width:'+w+'%;background:'+d.c;
    return '<div class="mv" data-open="'+esc(r.name)+'" title="'+esc(t('movers.clickHint',{name:tName(r.name)}))+'" style="display:grid;grid-template-columns:220px 1fr 84px;align-items:center;gap:12px;padding:4px 6px;cursor:pointer;border-radius:7px">'
      +'<div style="display:flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0">'
        +'<span style="font-size:12.5px;color:#E2E8F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(tName(r.name))+(r.forecast?' <span style="color:#4ADE80" title="'+esc(t('tip.forward'))+'">◈</span>':'')+'</span>'
        +'<span class="dot" style="width:8px;height:8px;background:'+catColor(r.category)+'"></span></div>'
      +'<div style="position:relative;height:16px"><div style="position:absolute;top:2px;bottom:2px;border-radius:3px;'+bar+'"></div></div>'
      +'<div class="num" style="font-size:12.5px;font-weight:700;color:'+d.c+'">'+arrow(v)+' '+esc(pct(v))+'</div></div>';
  }).join('');

  var sortArrow=function(k){return state.sortKey===k?(state.sortDir<0?' ↓':' ↑'):'';};
  var tRows=rows.slice().sort(function(a,b){
    var k=state.sortKey;
    if(k==='name') return state.sortDir*cmp(tName(a.name),tName(b.name));
    var av=a[k], bv=b[k]; if(typeof av!=='number')av=-1e9; if(typeof bv!=='number')bv=-1e9;
    return state.sortDir*(bv-av);
  }).map(function(r){
    return '<tr data-open="'+esc(r.name)+'" style="border-left-color:'+catColor(r.category)+'">'
      +'<td><span style="display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;font-size:12px"><span class="dot" style="width:8px;height:8px;background:'+catColor(r.category)+'"></span>'+esc(tCat(r.category))+'</span></td>'
      +'<td style="font-weight:600">'+esc(tName(r.name))+(r.forecast?' <span style="color:#4ADE80" title="'+esc(t('tip.forward'))+'">◈</span>':'')+'</td>'
      +'<td class="num" style="color:var(--muted);font-size:12px">'+esc(r.price||'—')+'</td>'
      +'<td style="text-align:center">'+pillHTML(r.mom)+'</td>'
      +'<td style="text-align:center">'+pillHTML(r.yoy)+'</td></tr>';
  }).join('');

  var hasFc=rep.rows.some(function(r){return r.forecast;});

function strategyHTML(rep){
  var withY=rep.rows.filter(function(r){return typeof r.yoy==='number';});
  var risk=withY.slice().sort(function(a,b){return b.yoy-a.yoy;}).filter(function(r){return r.yoy>0;}).slice(0,5);
  var opp=withY.slice().sort(function(a,b){return a.yoy-b.yoy;}).filter(function(r){return r.yoy<0;}).slice(0,5);
  // Watch-list = biggest MoM movers NOT already shown as a risk/opportunity,
  // so a commodity never appears in two columns.
  var used={}; risk.concat(opp).forEach(function(r){used[r.name]=1;});
  var watch=withY.slice().filter(function(r){return !used[r.name];}).sort(function(a,b){return Math.abs(b.mom||0)-Math.abs(a.mom||0);}).slice(0,5);
  function col(title,glyph,gc,items){
    return '<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:11px"><span style="font-size:13px;color:'+gc+'">'+glyph+'</span>'
      +'<h4 style="font-size:14px;font-weight:700;margin:0;color:'+gc+'">'+esc(title)+'</h4></div><div style="display:flex;flex-direction:column;gap:8px">'
      +items.map(function(r){var d=divColor(r.yoy);return '<div class="mv" data-open="'+esc(r.name)+'" style="display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;background:var(--bg);border:1px solid var(--border2);cursor:pointer">'
        +'<span class="dot" style="width:7px;height:7px;background:'+catColor(r.category)+'"></span>'
        +'<span style="flex:1;min-width:0"><span class="nm" style="font-size:12.5px">'+esc(tName(r.name))+'</span><span style="font-size:10.5px;color:var(--dim)">'+esc(tCat(r.category))+'</span></span>'
        +'<span style="text-align:right"><span class="num" style="display:block;font-size:11.5px;font-weight:700;color:'+d.c+'">'+esc(pct(r.yoy))+'</span><span style="font-size:10px;color:var(--dim)">'+esc(t('common.yoy'))+'</span></span></div>';}).join('')
      +'</div></div>';
  }
  return '<div class="panel" style="animation:cdFade .25s ease"><h3 style="font-size:17px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px">🛡️ '+esc(t('act.title'))+'</h3>'
    +'<p class="cap" style="margin:0 0 16px">'+esc(t('act.sub'))+'</p>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px">'
      +col(t('act.hedge'),'▲','var(--up)',risk)+col(t('act.lock'),'▼','var(--down)',opp)+col(t('act.watch'),'•','var(--warn)',watch)
    +'</div></div>';
}

/* ---------------- INDIRECT INFLATION ----------------
   Cost that reaches a delivered price without appearing in the commodity
   quote: energy, freight, labour and the inputs upstream of packaging.

   Deliberately kept out of the quarter report: that screen is the direct
   commodity view, and mixing the two invites reading a freight index as if
   it were a commodity price. Indirect has its own landing section, its own
   route and its own screen; the only tie between them is the topbar link
   and the packaging cross-link. Same separation the Germany deep-dive uses.

   Optional per quarter — a quarter with no data/{slug}/indirect.json simply
   renders none of this (no menu section, no card, no route). */

  if(sel && sel!=='macro' && !ind.pillars.some(function(x){return x.key===sel;})) sel=null;
  var railItem=function(key,color,net,count,active){
    var d=divColor(net);
    return '<button class="rail-item '+(active?'active':'')+'" data-go="#/q/'+state.slug+'/indirect'+(key?'/'+encodeURIComponent(key):'')+'">'
      +'<span class="dot" style="width:9px;height:9px;background:'+color+'"></span>'
      +'<span style="flex:1;min-width:0"><span class="nm">'+esc(key?indPillarLabel(key):t('ind.allPillars'))+'</span>'
      +(count!=null?'<span class="sub">'+esc(t('ind.indicators',{n:count}))+'</span>':'')+'</span>'
      +(typeof net==='number'?'<span class="num" style="font-size:11.5px;font-weight:700;color:'+d.c+'">'+esc(pct(net))+'</span>':'')+'</button>';
  };
  var rail='<div class="rail-h">'+esc(t('ind.railHead'))+'</div>'
    +railItem(null,'linear-gradient(135deg,#F97316,#A78BFA)',ind.net,null,!sel)
    +'<div style="height:1px;background:#1E293B;margin:5px 4px"></div>'
    +ind.pillars.map(function(p){return railItem(p.key,p.color,p.netYoY,p.count,sel===p.key);}).join('')
    +(ind.macro.length?railItem('macro','#94A3B8',null,null,sel==='macro'):'');

  // Pillar commentary, the summary paragraph and the actions are analyst-written

  var srcNote=(LANG!=='en')
    ? '<div class="note"><span style="color:var(--dim);flex:none">ⓘ</span><p>'+esc(t('note.sourceEnglish'))+'</p></div>' : '';

  var summary=ind.summary&&ind.summary.headline

        +'<p style="font-size:13.5px;color:#CBD5E1;margin:0;line-height:1.7">'+esc(ind.summary.headline)+'</p>'
        +(ind.summary.gap&&ind.summary.gap.note
          ? '<p class="cap" style="margin:12px 0 0;border-top:1px solid var(--border2);padding-top:11px">'+esc(ind.summary.gap.note)+'</p>' : '')

    : '';

  var actions=(ind.actions||[]).length

        +'<h3 style="font-size:17px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px">🛡️ '+esc(t('ind.actionsTitle'))+'</h3>'
        +'<p class="cap" style="margin:6px 0 16px">'+esc(t('ind.actionsSub'))+'</p>'
        +'<div style="display:flex;flex-direction:column;gap:11px">'
        +ind.actions.map(function(a){
          var col=a.tone==='red'?'var(--up)':a.tone==='green'?'var(--down)':a.tone==='amber'?'var(--warn)':'var(--blue)';
          return '<div style="padding:13px 15px;border-radius:10px;background:var(--bg);border-left:3px solid '+col+'">'
            +'<p style="font-size:12.5px;font-weight:700;margin:0;color:'+col+'">'+esc(a.label)+'</p>'
            +'<p style="font-size:12.5px;color:#CBD5E1;margin:6px 0 0;line-height:1.6">'+esc(a.body)+'</p></div>';
        }).join('')
        +'</div></div>'
    : '';

  var sources=(ind.meta.sources||[]).length
    ? '<div class="note"><span style="color:var(--dim);flex:none">ⓘ</span><p><b style="color:#CBD5E1">'+esc(t('ind.sourcesTitle'))+'</b> '
        +esc(ind.meta.sources.join(' · '))+'</p></div>' : '';

  var body;
  if(sel==='macro') body=indMacroPanel(ind);
  else if(sel){
    body=indPillarPanel(ind.pillars.filter(function(x){return x.key===sel;})[0])+srcNote;
  } else {
    body=summary
      +ind.pillars.map(indPillarPanel).join('')
      +(ind.macro.length?indMacroPanel(ind):'')
      +actions+srcNote+sources;
  }

  var net=divColor(ind.net);
  return '<div style="animation:cdFade .3s ease">'
    +'<div class="topbar"><div class="topbar-in">'
      +'<button class="back" data-go="#/"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>'+esc(t('common.allQuarters'))+'</button>'
      +'<button class="back" data-go="#/q/'+state.slug+'">'+esc(t('common.quarterReport'))+'</button>'
      +'<div style="display:flex;align-items:center;gap:10px"><span style="font-size:22px">⚙️</span>'
        +'<div><div style="font-size:14px;font-weight:700;line-height:1.1">'+esc(t('ind.title'))+' · '+esc(qLabel(rep.meta.qn,rep.meta.fy,rep.meta.q))+'</div>'

      +'<span style="flex:1"></span>'
      +langPickerHTML()
      +'<span class="num" style="font-size:11px;font-weight:700;color:'+net.c+';background:'+net.bg+';border:1px solid '+net.c+'55;padding:4px 9px;border-radius:7px">'
      +esc(t('ind.netPressure'))+' '+esc(pct(ind.net))+'</span>'
    +'</div></div>'
    +'<div class="wrapR layout"><aside class="rail">'+rail+'</aside><main class="content">'
      +'<div class="note"><span style="color:var(--dim);flex:none">ⓘ</span><p><b style="color:#CBD5E1">'+esc(t('ind.noteKey'))+'</b> '
        +t('ind.note',{energy:indBold(t('ind.pillar.energy')),freight:indBold(t('ind.pillar.freight')),
                       labour:indBold(t('ind.pillar.labour')),inputs:indBold(t('ind.pillar.inputs'))})+'</p></div>'
      +'<div class="note" style="border-color:rgba(250,204,21,.28)"><span style="color:var(--warn);flex:none">ⓘ</span><p><b style="color:#CBD5E1">'
        +esc(t('ind.vintageKey'))+'</b> '+t('ind.vintage',{mom:indBold(t('common.mom')),qoq:indBold(t('common.qoq'))})+'</p></div>'
      +'<div class="kpis">'+ind.kpis.map(kpiHTML).join('')+'</div>'
      +body
    +'</main></div></div>';
}

/* ---------------- GERMANY ---------------- */
function germanyHTML(){
  var rep=D.reports[state.slug], g=rep.germany;
  if(!g) return '<div class="wrap">'+esc(t('de.none'))+' <button class="back" data-go="#/">'+esc(t('common.back'))+'</button></div>';
  var groups=g.groups.slice();
  var sel=state.gGroup && groups.filter(function(x){return x.coicop===state.gGroup;})[0];
  var railAll=!sel;
  var rail='<div class="rail-h">'+esc(t('de.railHead'))+'</div>'
    +'<button class="rail-item '+(railAll?'active':'')+'" data-go="#/q/'+state.slug+'/germany">'
      +'<span class="dot" style="width:9px;height:9px;background:linear-gradient(135deg,#60A5FA,#FACC15)"></span>'
      +'<span style="flex:1;font-size:13.5px;font-weight:600">'+esc(t('de.foodOverview'))+'</span></button>'
    +'<div style="height:1px;background:#1E293B;margin:5px 4px"></div>'
    +groups.map(function(s){var d=divColor(s.yoy);
      return '<button class="rail-item '+(sel&&sel.coicop===s.coicop?'active':'')+'" data-go="#/q/'+state.slug+'/germany/'+s.coicop+'">'
        +'<span class="dot" style="width:9px;height:9px;background:'+groupColor(s.coicop)+'"></span>'
        +'<span style="flex:1;min-width:0"><span class="nm">'+esc(tCoicop(s.coicop,s.label))+'</span>'
        +'<span class="sub num">'+esc(t('common.idx',{v:numf(s.index)}))+'</span></span>'
        +'<span class="num" style="font-size:11.5px;font-weight:700;color:'+d.c+'">'+esc(pct(s.yoy))+'</span></button>';
    }).join('');

  var kpis=g.kpis.map(kpiHTML).join('');

  // Bar width is scaled across the group's min..max index so the high->low
  // ranking is visible (all indices sit in a narrow 130-170 band, so scaling
  // from zero would make every bar look the same length).
  var idxVals=groups.map(function(s){return s.index;}).filter(function(v){return typeof v==='number';});
  var maxIdx=Math.max.apply(null,idxVals.concat([1]));
  var minIdx=Math.min.apply(null,idxVals.concat([maxIdx]));
  var span=Math.max(1,maxIdx-minIdx);
  var bars=groups.map(function(s){var w=(typeof s.index==='number')?15+(s.index-minIdx)/span*85:3;var d=divColor(s.yoy);
    var label=tCoicop(s.coicop,s.label);
    return '<div title="'+esc(label+' · '+t('common.idx',{v:numf(s.index)})+' · '+pct(s.yoy)+' '+t('common.yoy'))+'" style="display:grid;grid-template-columns:130px 1fr auto;align-items:center;gap:10px">'
      +'<div style="display:flex;align-items:center;gap:7px;min-width:0"><span class="dot" style="width:8px;height:8px;background:'+groupColor(s.coicop)+'"></span><span style="font-size:11.5px;color:#E2E8F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(label)+'</span></div>'
      +'<div style="height:14px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;border-radius:4px;width:'+w+'%;background:'+groupColor(s.coicop)+';opacity:.85"></div></div>'
      +'<span class="num" style="font-size:12px;font-weight:700;color:'+d.c+';min-width:62px;text-align:right">'+esc(pct(s.yoy))+'</span></div>';
  }).join('');

  var right = sel ? germanyGroupPanel(sel) :
    '<div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;animation:cdFade .25s ease" class="hicpgrid">'
      +'<div class="panel"><h3 style="font-size:17px;font-weight:700;margin:0">'+esc(t('de.trendTitle'))+'</h3>'
        +'<p style="font-size:12px;color:var(--muted);margin:5px 0 0">'+esc(t('de.trendSub'))+'</p>'
        +'<div style="height:280px;margin-top:14px"><canvas id="gTrend"></canvas></div></div>'
      +'<div class="panel"><h3 style="font-size:16px;font-weight:700;margin:0">'+esc(t('de.groupsTitle'))+'</h3>'
        +'<p style="font-size:12px;color:var(--muted);margin:5px 0 12px">'+esc(t('de.groupsSub',{yoy:t('common.yoy')}))+'</p>'
        +'<div style="display:flex;flex-direction:column;gap:9px">'+bars+'</div></div>'
    +'</div>';

  var b=function(s){return '<b style="color:#CBD5E1">'+esc(s)+'</b>';};
  return '<div style="animation:cdFade .3s ease">'
    +'<div class="topbar"><div class="topbar-in">'
      +'<button class="back" data-go="#/"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>'+esc(t('common.allQuarters'))+'</button>'
      +'<button class="back" data-go="#/q/'+state.slug+'">'+esc(t('common.quarterReport'))+'</button>'
      +'<div style="display:flex;align-items:center;gap:10px"><span style="font-size:22px">🇩🇪</span>'
        +'<div><div style="font-size:14px;font-weight:700;line-height:1.1">'+esc(t('menu.germanyCard',{q:qLabel(rep.meta.qn,rep.meta.fy,rep.meta.q)}))+'</div>'
        +'<div style="font-size:11.5px;color:var(--muted)">'+esc(t('de.headerSub',{month:locMonth(g.meta.latestMonth)}))+'</div></div></div>'
      +'<span style="flex:1"></span>'
      +langPickerHTML()
      +'<span class="num" style="font-size:11px;font-weight:700;color:var(--warn);background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.3);padding:4px 9px;border-radius:7px">'
      +esc(t('chart.baseLabel',{base:g.trend.base}))+'</span>'
    +'</div></div>'
    +'<div class="wrapR layout"><aside class="rail">'+rail+'</aside><main class="content">'
      +'<div class="note" style="border-color:rgba(250,204,21,.28)"><span style="color:var(--warn);flex:none">ⓘ</span><p><b style="color:#CBD5E1">'
        +esc(t('de.baseNoteKey'))+'</b> '+t('de.baseNote',{gbase:b('2020 = 100'),base:b('2025 = 100'),notcomp:b(t('de.notComparable'))})+'</p></div>'
      +'<div class="kpis">'+kpis+'</div>'+right
    +'</main></div></div>';
}
function germanyGroupPanel(s){
  var d=divColor(s.yoy),dm=divColor(s.mom);
  var tile=function(lab,val,color){
    return '<div style="padding:14px 15px;border-radius:11px;background:var(--bg);border:1px solid var(--border2)">'
      +'<p style="font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--dim);margin:0">'+esc(lab)+'</p>'
      +'<p class="num" style="font-size:20px;font-weight:800;margin:7px 0 0'+(color?';color:'+color:'')+'">'+esc(val)+'</p></div>';
  };
  return '<div class="panel" style="animation:cdFade .25s ease;border-top:3px solid '+groupColor(s.coicop)+'">'
    +'<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="dot" style="width:14px;height:14px;border-radius:4px;background:'+groupColor(s.coicop)+'"></span>'
      +'<h2 style="font-size:21px;font-weight:800;margin:0">'+esc(tCoicop(s.coicop,s.label))+'</h2><span class="num" style="font-size:12px;color:var(--dim)">'+esc(s.coicop)+'</span></div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px">'
      +tile(t('de.indexLabel'),numf(s.index))
      +tile(t('common.yoy'),pct(s.yoy),d.c)
      +tile(t('common.mom'),pct(s.mom),dm.c)
    +'</div><p class="cap" style="margin:14px 0 0">'+esc(t('de.groupFootnote'))+'</p></div>';
}
var GROUP_COLORS=['#F87171','#FBBF24','#A3E635','#34D399','#22D3EE','#60A5FA','#A78BFA','#F472B6','#FB923C','#2DD4BF','#C084FC','#E879F9'];
function groupColor(coicop){var n=parseInt((coicop||'').replace(/\D/g,'').slice(-2)||'0',10);return GROUP_COLORS[n%GROUP_COLORS.length];}

/* ---------------- MODAL ---------------- */
function openModal(name){
  var rep=D.reports[state.slug];
  var r=rep.rows.filter(function(x){return x.name===name;})[0]; if(!r) return;
  var ov=overrides(rep);
  var note=(ov&&ov.notes&&ov.notes[r.name])||r.note;
  var translated=!!(ov&&ov.notes&&ov.notes[r.name]);
  var fc=r.forecast;
  var chart=fc?'<div style="height:180px;margin-top:14px"><canvas id="fcChart"></canvas></div>'
    +'<p class="cap" style="margin:8px 0 0">'+esc(t('modal.forecast',{desc:fc.desc,unit:fc.unit}))+'</p>':'';
  var srcNote=(note && !translated && LANG!=='en')
    ? '<p class="cap" style="margin:10px 0 0">'+esc(t('note.sourceEnglish'))+'</p>' : '';
  var ovEl=document.createElement('div'); ovEl.className='overlay'; ovEl.id='ov';
  ovEl.innerHTML='<div class="modal" style="position:relative"><button class="x" data-close title="'+esc(t('modal.close'))+'" aria-label="'+esc(t('modal.close'))+'">✕</button>'
    +'<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap"><span class="dot" style="width:11px;height:11px;border-radius:3px;background:'+catColor(r.category)+'"></span>'
      +'<h2 style="font-size:20px;font-weight:800;margin:0">'+esc(tName(r.name))+'</h2>'
      +'<span style="font-size:12px;color:var(--muted)">'+esc(tCat(r.category))+'</span></div>'
    +'<div style="display:flex;gap:10px;margin:14px 0 0;flex-wrap:wrap">'
      +'<div style="padding:10px 13px;border-radius:10px;background:var(--bg);border:1px solid var(--border2)"><div style="font-size:10px;text-transform:uppercase;color:var(--dim);font-weight:700">'+esc(t('modal.price'))+'</div><div class="num" style="font-size:16px;font-weight:800;margin-top:3px">'+esc(r.price||'—')+'</div></div>'
      +'<div style="padding:10px 13px;border-radius:10px;background:var(--bg);border:1px solid var(--border2)"><div style="font-size:10px;text-transform:uppercase;color:var(--dim);font-weight:700">'+esc(t('common.mom'))+'</div><div style="margin-top:3px">'+pillHTML(r.mom)+'</div></div>'
      +'<div style="padding:10px 13px;border-radius:10px;background:var(--bg);border:1px solid var(--border2)"><div style="font-size:10px;text-transform:uppercase;color:var(--dim);font-weight:700">'+esc(t('common.yoy'))+'</div><div style="margin-top:3px">'+pillHTML(r.yoy)+'</div></div></div>'
    +(note?'<p style="font-size:13px;color:#CBD5E1;line-height:1.6;margin:16px 0 0">'+esc(note)+'</p>':'<p class="cap" style="margin:16px 0 0">'+esc(t('modal.noComment'))+'</p>')
    +srcNote+chart+'</div>';
  ovEl.addEventListener('click',function(e){if(e.target===ovEl||e.target.hasAttribute('data-close'))closeModal();});
  document.body.appendChild(ovEl);
  if(fc) drawForecast(fc);
}
function closeModal(){var o=document.getElementById('ov');if(o)o.remove();}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

/* ---------------- CHARTS ---------------- */
var _charts=[];
function killCharts(){_charts.forEach(function(c){try{c.destroy();}catch(e){}});_charts=[];}
function lineChart(id,labels,values,color,unit){
  var el=document.getElementById(id); if(!el||!window.Chart) return;
  var ctx=el.getContext('2d');
  var grad=ctx.createLinearGradient(0,0,0,260); grad.addColorStop(0,color+'55'); grad.addColorStop(1,color+'05');
  _charts.push(new Chart(ctx,{type:'line',data:{labels:labels,datasets:[{data:values,borderColor:color,backgroundColor:grad,borderWidth:2,fill:true,tension:.32,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:color,pointHoverBorderColor:'#0F172A',pointHoverBorderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},hover:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:'#0F172A',borderColor:'#334155',borderWidth:1,titleColor:'#F8FAFC',bodyColor:'#F8FAFC',bodyFont:{size:13,weight:'700'},padding:10,displayColors:false,callbacks:{title:function(items){return items.length?items[0].label:'';},label:function(ctx){var v=ctx.parsed.y;var s=(typeof v==='number'?v.toLocaleString(LOCALE,{maximumFractionDigits:2}):v);return unit?(s+' '+unit):s;}}}},
    scales:{x:{grid:{color:'#1E293B'},ticks:{color:'#64748B',font:{size:10},maxRotation:0,autoSkip:false,callback:function(v,i){var L=this.chart.data.labels;var step=Math.max(1,Math.ceil(L.length/6));return (L.length-1-i)%step===0?L[i]:'';}}},y:{grid:{color:'#1E293B'},ticks:{color:'#64748B',font:{size:10},callback:function(v){return numf(v,0,2);}}}}}}));
}
function drawForecast(fc){
  var el=document.getElementById('fcChart'); if(!el||!window.Chart) return;
  lineChart('fcChart',fc.points.map(function(p){return p.d;}),fc.points.map(function(p){return p.v;}),'#4ADE80',fc.unit||'');
}

/* ---------------- MOUNT + EVENTS ---------------- */
function render(){
  killCharts();
  var app=document.getElementById('app');
  if(state.screen==='menu') app.innerHTML=menuHTML();
  else if(state.screen==='germany') app.innerHTML=germanyHTML();
  else if(state.screen==='indirect') app.innerHTML=indirectHTML();
  else app.innerHTML=reportHTML();
  // charts after DOM is in place
  if(state.screen==='report' && !state.cat){
    var rep=D.reports[state.slug];
    lineChart('hicpChart',rep.hicp.labels.map(locMonth),rep.hicp.values,'#60A5FA',t('common.indexUnit'));
  }
  if(state.screen==='germany' && !state.gGroup){
    var g=D.reports[state.slug].germany;
    if(g) lineChart('gTrend',g.trend.labels.map(locMonth),g.trend.values,'#FBBF24',t('common.indexUnit'));
  }
}
document.getElementById('app').addEventListener('click',function(e){
  // NB: not named `t` — that is the translation helper.
  var el=e.target.closest('[data-go],[data-open],[data-rank],[data-tab],[data-sort]');
  if(!el) return;
  if(el.hasAttribute('data-go')){go(el.getAttribute('data-go'));return;}
  if(el.hasAttribute('data-open')){openModal(el.getAttribute('data-open'));return;}
  if(el.hasAttribute('data-rank')){state.rankBy=el.getAttribute('data-rank');render();return;}
  if(el.hasAttribute('data-tab')){state.tab=el.getAttribute('data-tab');render();return;}
  if(el.hasAttribute('data-sort')){var k=el.getAttribute('data-sort');if(state.sortKey===k)state.sortDir*=-1;else{state.sortKey=k;state.sortDir=k==='name'?1:-1;}render();return;}
});
document.getElementById('app').addEventListener('input',function(e){
  if(e.target.id==='q'){state.q=e.target.value;
    // re-render only the movers/table + keep focus
    render();var i=document.getElementById('q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
});
document.getElementById('app').addEventListener('change',function(e){
  if(e.target.id==='cdlang'){ setLang(e.target.value,true); closeModal(); render(); }
});
setLang(pickLang(),false);
route();
})();
</script>
</body>
</html>
