name: Look up Destatis table names (one-off)
on:
  workflow_dispatch:
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Names
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          tok = os.environ["GENESIS_TOKEN"].strip()
          for code in ["61111-0002", "61111-0004", "61241-0006", "61311-0006", "62361-0001"]:
              body = urllib.parse.urlencode({"selection": code, "area": "all", "searchcriterion": "code", "pagelength": "5", "language": "en"}).encode()
              req = urllib.request.Request("https://genesis.destatis.de/genesisWS/rest/2020/catalogue/tables", data=body, method="POST",
                  headers={"username": tok, "password": "", "Content-Type": "application/x-www-form-urlencoded"})
              try:
                  j = json.loads(urllib.request.urlopen(req, timeout=120).read())
                  for t in j.get("List", []):
                      print("NAME|", t.get("Code"), "|", " ".join(str(t.get("Content")).split()), "|", t.get("Time", ""))
              except Exception as e:
                  print("NAME|", code, "| failed", type(e).__name__)
          PY
