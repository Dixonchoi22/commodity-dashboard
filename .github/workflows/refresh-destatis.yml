name: Refresh Destatis data (monthly)

# Downloads the latest Destatis 61111-0004 table through the Genesis API,
# rebuilds the affected quarter's report and redeploys Pages.
# Needs the repository secret GENESIS_TOKEN
# (Settings -> Secrets and variables -> Actions).
#
# Runs automatically on the 16th of every month (Destatis publishes the final
# monthly CPI around the 10th-13th) and can also be started by hand. Only the
# newest quarter in the manifest is refreshed, and only the Germany data
# changes - the Expana commodity figures stay a quarterly snapshot.

on:
  schedule:
    - cron: "23 7 16 * *"   # 07:23 UTC on the 16th
  workflow_dispatch:
    inputs:
      slug:
        description: "Quarter slug to refresh, e.g. 2026-10 (blank = newest in manifest)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-destatis
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick quarter
        id: q
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          SLUG="$INPUT_SLUG"
          if [ -z "$SLUG" ]; then
            SLUG=$(python3 -c "import json;print(json.load(open('data/manifest.json'))['reports'][0]['slug'])")
          fi
          case "$SLUG" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]) ;;
            *) echo "bad slug: $SLUG"; exit 1 ;;
          esac
          test -d "data/$SLUG" || { echo "data/$SLUG does not exist"; exit 1; }
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Fetch Destatis via API
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
          PYTHONUTF8: "1"
        run: python3 scripts/fetch_destatis.py "${{ steps.q.outputs.slug }}" --api

      - name: Fetch Germany price series for the indirect-inflation screen
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
          PYTHONUTF8: "1"
        run: python3 scripts/fetch_indirect_de.py --api

      - name: Fetch UK / IE / DK / SE / NO / NL / IT price series (public APIs, no token)
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/fetch_indirect_countries.py

      - name: Rebuild report and menu
        env:
          PYTHONUTF8: "1"
        run: |
          python3 scripts/build_html.py "${{ steps.q.outputs.slug }}"
          python3 scripts/build_dashboard.py

      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG="${{ steps.q.outputs.slug }}"
          # The downloaded zip differs byte-for-byte on every run, so decide
          # on the parsed data instead.
          if git diff --quiet -- "data/$SLUG/destatis.json" data/indirect_de.json data/indirect_countries.json; then
            echo "No new Destatis data for $SLUG - nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          git commit -m "Refresh Destatis data for ${{ steps.q.outputs.slug }}"
          git push origin HEAD:main
          # Pushes made with GITHUB_TOKEN do not trigger other workflows,
          # so start the Pages deploy explicitly.
          gh workflow run pages.yml --ref main
