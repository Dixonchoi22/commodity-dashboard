name: Refresh data (automatic)

# Downloads the latest Destatis 61111-0004 table through the Genesis API,
# rebuilds the affected quarter's report and redeploys Pages.
# Needs the repository secret GENESIS_TOKEN
# (Settings -> Secrets and variables -> Actions).
#
# Runs by itself every Monday morning (no one needs to start it). Every source
# publishes on its own calendar - Destatis around the 10th-13th, ONS and Eurostat
# at different dates, ECB early in the month - so a weekly check picks each new
# release up within days. It only commits and redeploys when a number actually
# changed. It can also be started by hand from the Actions tab.
# Only the newest quarter in the manifest is refreshed, and only the country
# price data changes - the Expana commodity figures stay a quarterly snapshot.
# If a run fails it opens (or comments on) a GitHub issue, which e-mails the
# repository owner.

on:
  schedule:
    - cron: "17 6 * * 1"    # 06:17 UTC every Monday
  workflow_dispatch:
    inputs:
      slug:
        description: "Quarter slug to refresh, e.g. 2026-10 (blank = newest in manifest)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: refresh-destatis
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick quarter
        id: q
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          SLUG="$INPUT_SLUG"
          if [ -z "$SLUG" ]; then
            SLUG=$(python3 -c "import json;print(json.load(open('data/manifest.json'))['reports'][0]['slug'])")
          fi
          case "$SLUG" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]) ;;
            *) echo "bad slug: $SLUG"; exit 1 ;;
          esac
          test -d "data/$SLUG" || { echo "data/$SLUG does not exist"; exit 1; }
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Fetch Destatis via API
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
          PYTHONUTF8: "1"
        run: python3 scripts/fetch_destatis.py "${{ steps.q.outputs.slug }}" --api

      - name: Fetch Germany price series for the indirect-inflation screen
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
          PYTHONUTF8: "1"
        run: python3 scripts/fetch_indirect_de.py --api

      - name: Fetch UK / IE / DK / SE / NO / NL / IT price series (public APIs, no token)
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/fetch_indirect_countries.py

      - name: Fetch food CPI for all markets (Eurostat HICP + ONS, no token)
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/fetch_food_cpi.py

      - name: Project the food CPI 6 months ahead (statistical, Eurostat + ONS history)
        env:
          PYTHONUTF8: "1"
        run: |
          pip install --quiet statsmodels pandas numpy
          python3 scripts/forecast_food.py
          python3 scripts/forecast_food_ets.py
          python3 scripts/archive_food_forecast.py
          python3 scripts/score_food_forecast.py

      - name: Rebuild report and menu
        env:
          PYTHONUTF8: "1"
        run: |
          python3 scripts/build_html.py "${{ steps.q.outputs.slug }}"
          python3 scripts/build_dashboard.py

      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SLUG="${{ steps.q.outputs.slug }}"
          # The downloaded zip differs byte-for-byte on every run, so decide
          # on the parsed data instead.
          if git diff --quiet -- "data/$SLUG/destatis.json" data/indirect_de.json data/indirect_countries.json data/food_cpi.json data/food_forecast.json data/food_forecast_ets.json data/food_forecast_archive.json data/food_forecast_live.json; then
            echo "No new Destatis data for $SLUG - nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          git commit -m "Refresh Destatis data for ${{ steps.q.outputs.slug }}"
          git push origin HEAD:main
          # Pushes made with GITHUB_TOKEN do not trigger other workflows,
          # so start the Pages deploy explicitly.
          gh workflow run pages.yml --ref main

      - name: Open an issue if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automatic data refresh failed"
          body="The scheduled data refresh did not finish. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
